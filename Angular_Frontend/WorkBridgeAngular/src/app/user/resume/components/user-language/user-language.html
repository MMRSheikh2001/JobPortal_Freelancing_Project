<div class="container py-4">

    <!-- ========================= -->
    <!-- Card -->
    <!-- ========================= -->

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">

                <i class="bi bi-translate me-2"></i>

                User Languages

            </h4>

        </div>

        <div class="card-body">

            <form (ngSubmit)="save()">

                <div class="row g-3">

                    <!-- ========================= -->
                    <!-- Language -->
                    <!-- ========================= -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Language

                        </label>

                        <select class="form-select" name="languageId" [(ngModel)]="userLanguage.languageId" required>

                            <option [ngValue]="0">

                                -- Select Language --

                            </option>

                            <option *ngFor="let language of languages" [ngValue]="language.id">

                                {{language.name}}

                            </option>

                        </select>

                    </div>

                    <!-- ========================= -->
                    <!-- Proficiency -->
                    <!-- ========================= -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Proficiency

                        </label>

                        <select class="form-select" name="proficiency" [(ngModel)]="userLanguage.proficiency" required>

                            <option *ngFor="let level of proficiencyLevels" [ngValue]="level">

                                {{level}}

                            </option>

                        </select>

                    </div>

                </div>

                <hr>

                <!-- ========================= -->
                <!-- Buttons -->
                <!-- ========================= -->

                <div class="d-flex gap-2">

                    <button class="btn btn-success" type="submit">

                        <i class="bi" [class.bi-plus-circle]="!isEdit" [class.bi-pencil-square]="isEdit">

                        </i>

                        {{isEdit ? 'Update Language' : 'Add Language'}}

                    </button>

                    <button class="btn btn-secondary" type="button" (click)="reset()">

                        <i class="bi bi-arrow-counterclockwise"></i>

                        Reset

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ========================= -->
    <!-- Language List -->
    <!-- ========================= -->

    <div class="card shadow mt-4">

        <div class="card-header">

            <h5 class="mb-0">

                My Languages

            </h5>

        </div>

        <div class="card-body p-0">

            <table class="table table-hover table-bordered mb-0">

                <thead class="table-light">

                    <tr>

                        <th>#</th>

                        <th>Language</th>

                        <th>Proficiency</th>

                        <th width="160">

                            Action

                        </th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="
                            let language of userLanguages;
                            let i=index
                        ">

                        <td>

                            {{i+1}}

                        </td>

                        <td>

                            {{language.languageName}}

                        </td>

                        <td>

                            <span class="badge bg-info">

                                {{language.proficiency}}

                            </span>

                        </td>

                        <td>

                            <button class="btn btn-warning btn-sm me-2" (click)="edit(language)">

                                <i class="bi bi-pencil"></i>

                            </button>

                            <button class="btn btn-danger btn-sm" (click)="delete(language.id)">

                                <i class="bi bi-trash"></i>

                            </button>

                        </td>

                    </tr>

                    <tr *ngIf="userLanguages.length==0">

                        <td colspan="4" class="text-center text-muted py-4">

                            No language added yet.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
