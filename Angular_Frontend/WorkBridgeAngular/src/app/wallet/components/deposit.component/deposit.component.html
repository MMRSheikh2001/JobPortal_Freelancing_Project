<div class="container py-4">

    <!-- Loading -->

    <div *ngIf="loading" class="text-center py-5">

        <div class="spinner-border text-primary"></div>

        <p class="mt-3">

            Redirecting to SSLCommerz...

        </p>

    </div>

    <!-- Deposit Card -->

    <div *ngIf="!loading" class="row justify-content-center">

        <div class="col-lg-5 col-md-7">

            <div class="card shadow-sm">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">

                        Add Money to Wallet

                    </h4>

                </div>

                <div class="card-body">

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Deposit Amount (৳)

                        </label>

                        <input type="number" class="form-control form-control-lg" [(ngModel)]="amount"
                            [min]="minimumAmount" [max]="maximumAmount" placeholder="Enter amount">

                        <div class="form-text">

                            Minimum:
                            <strong>

                                ৳{{minimumAmount}}

                            </strong>

                            |

                            Maximum:
                            <strong>

                                ৳{{maximumAmount}}

                            </strong>

                        </div>

                    </div>

                    <div class="alert alert-info">

                        <strong>

                            Payment Gateway

                        </strong>

                        <br>

                        You will be redirected to
                        <strong>

                            SSLCommerz

                        </strong>

                        to complete your payment securely.

                    </div>

                    <div class="d-grid gap-2 mt-4">

                        <button class="btn btn-success btn-lg" (click)="deposit()">

                            Deposit via SSLCommerz

                        </button>

                        <button class="btn btn-outline-secondary" (click)="cancel()">

                            Cancel

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
