<nav class="navbar navbar-light bg-white border-bottom px-4">

    <!-- Left Side: Logo & Navigation Links -->
    <div class="d-flex align-items-center gap-4">
        <h4 class="mb-0 text-primary fw-bold">
            WorkBridge
        </h4>

        <!-- Fixed: Replaced standalone <li> with an unstyled nav list or link group -->
        <div class="nav">
            <a class="nav-link text-secondary fw-semibold px-2" href="/">
                Home
            </a>
        </div>
           <div class="nav">
            <a class="nav-link text-secondary fw-semibold px-2" href="/user-report">
                Report
            </a>
        </div>
    </div>

    <!-- Right Side: Profile Info, Notifications & Logout -->
    <div class="d-flex align-items-center gap-3">

        <img [src]="imageUrl" class="rounded-circle" width="40" height="40">

        <div>
            <div class="fw-semibold">
                {{user?.displayName}}
            </div>
            <small class="text-muted">
                {{user?.email}}
            </small>
        </div>

        <div class="position-relative">
            <button class="btn btn-light border position-relative" (click)="goToNotifications()">
                <i class="bi bi-bell fs-5"></i>
                <span *ngIf="unreadCount > 0"
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                    {{ unreadCount }}
                </span>
            </button>
        </div>

        <button class="btn btn-outline-danger btn-sm" (click)="logout()">
            Logout
        </button>

    </div>

</nav>
