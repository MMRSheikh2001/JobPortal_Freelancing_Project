<div class="container py-4">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">

                My Saved Gigs

            </h2>

            <p class="text-muted mb-0">

                {{filteredGigs.length}} Saved Gig(s)

            </p>

        </div>

        <div class="w-25">

            <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="search" (input)="filter()">

        </div>

    </div>

    <!-- Loading -->

    <div *ngIf="loading" class="text-center py-5">

        <div class="spinner-border text-primary"></div>

    </div>

    <!-- Empty -->

    <div *ngIf="!loading && filteredGigs.length==0" class="text-center py-5">

        <i class="bi bi-bookmark-heart fs-1 text-secondary"></i>

        <h4 class="mt-3">

            No Saved Gigs

        </h4>

        <p class="text-muted">

            Save gigs to quickly find them later.

        </p>

    </div>

    <!-- Cards -->

    <div class="row" *ngIf="!loading && filteredGigs.length>0">

        <div class="col-lg-4 col-md-6 mb-4" *ngFor="let item of filteredGigs">

            <div class="card shadow-sm h-100">

                <!-- Image -->

                <img [src]="fileService.getGigImage(item.gigImage)" class="card-img-top"
                    style="height:220px;object-fit:cover;">

                <div class="card-body d-flex flex-column">

                    <h5 class="fw-bold">

                        {{item.gigTitle}}

                    </h5>

                    <p class="text-muted small flex-grow-1">

                        {{item.gigDescription}}

                    </p>

                    <div class="mb-2">

                        <span class="fw-semibold">

                            Freelancer:

                        </span>

                        {{item.freelancerName}}

                    </div>

                    <small class="text-secondary">

                        Saved on

                        {{item.createdAt | date:'mediumDate'}}

                    </small>

                </div>

                <div class="card-footer bg-white border-0">

                    <div class="d-grid gap-2">

                        <button class="btn btn-primary" (click)="view(item)">

                            <i class="bi bi-eye me-2"></i>

                            View Gig

                        </button>

                        <button class="btn btn-outline-danger" (click)="remove(item)">

                            <i class="bi bi-bookmark-x me-2"></i>

                            Remove

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
