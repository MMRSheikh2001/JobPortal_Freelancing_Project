<div class="container mt-4">

    <!-- Form -->

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">

                {{ isEdit ? 'Update Division' : 'Add Division' }}

            </h4>

        </div>

        <div class="card-body">

            <form (ngSubmit)="saveDivision()">

                <div class="row">

                    <!-- Country -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Country

                        </label>

                        <select class="form-select" name="countryId" [(ngModel)]="division.countryId" required>

                            <option [ngValue]="0">

                                -- Select Country --

                            </option>

                            <option *ngFor="let c of countries" [ngValue]="c.countryId">

                                {{ c.countryName }}

                            </option>

                        </select>

                    </div>

                    <!-- Division Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Division Name

                        </label>

                        <input type="text" class="form-control" name="divisionName" [(ngModel)]="division.divisionName"
                            required>

                    </div>

                </div>

                <button type="submit" class="btn btn-success me-2">

                    {{ isEdit ? 'Update' : 'Save' }}

                </button>

                <button type="button" class="btn btn-secondary" (click)="resetForm()">

                    Reset

                </button>

            </form>

        </div>

    </div>

    <!-- Division Table -->

    <div class="card shadow mt-4">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">

                Division List

            </h5>

        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-light">

                    <tr>

                        <th style="width:80px">

                            ID

                        </th>

                        <th>

                            Division

                        </th>

                        <th>

                            Country

                        </th>

                        <th>

                            Country Code

                        </th>

                        <th style="width:180px">

                            Action

                        </th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let d of divisions">

                        <td>

                            {{ d.divisionId }}

                        </td>

                        <td>

                            {{ d.divisionName }}

                        </td>

                        <td>

                            {{ d.countryName }}

                        </td>

                        <td>

                            {{ d.countryCode }}

                        </td>

                        <td>

                            <button class="btn btn-warning btn-sm me-2" (click)="editDivision(d)">

                                Edit

                            </button>

                            <button class="btn btn-danger btn-sm" (click)="deleteDivision(d.divisionId)">

                                Delete

                            </button>

                        </td>

                    </tr>

                    <tr *ngIf="divisions.length === 0">

                        <td colspan="5" class="text-center text-muted">

                            No Division Found

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
