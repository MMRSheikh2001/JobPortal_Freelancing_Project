<div class="container mt-4">

    <!-- Form Card -->
    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                Language Management
            </h4>
        </div>

        <div class="card-body">

            <form (ngSubmit)="saveLanguage()">

                <div class="row">

                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Language Name
                        </label>

                        <input type="text" class="form-control" [(ngModel)]="language.name" name="name"
                            placeholder="Enter Language Name" required>

                    </div>

                </div>

                <button type="submit" class="btn btn-success me-2">

                    {{ isEdit ? 'Update' : 'Save' }}

                </button>

                <button type="button" class="btn btn-secondary" (click)="resetForm()">

                    Reset

                </button>

            </form>

        </div>

    </div>

    <!-- Table Card -->
    <div class="card shadow mt-4">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">
                Language List
            </h5>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover table-striped">

                <thead class="table-light">

                    <tr>

                        <th>ID</th>

                        <th>Language Name</th>

                        <th width="180">Action</th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let l of languages">

                        <td>{{ l.id }}</td>

                        <td>{{ l.name }}</td>

                        <td>

                            <button class="btn btn-warning btn-sm me-2" (click)="editLanguage(l)">

                                Edit

                            </button>

                            <button class="btn btn-danger btn-sm" (click)="deleteLanguage(l.id)">

                                Delete

                            </button>

                        </td>

                    </tr>

                    <tr *ngIf="languages.length === 0">

                        <td colspan="3" class="text-center">

                            No Languages Found

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
