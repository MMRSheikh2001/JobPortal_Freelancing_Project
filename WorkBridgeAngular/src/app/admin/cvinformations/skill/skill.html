<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                Skill Management
            </h4>
        </div>

        <div class="card-body">

            <form (ngSubmit)="saveSkill()">

                <div class="row">

                    <!-- Skill Name -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Skill Name
                        </label>

                        <input type="text" class="form-control" [(ngModel)]="skill.skillName" name="skillName" required>

                    </div>

                    <!-- Category -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select class="form-select" [(ngModel)]="skill.categoryId" name="categoryId" required>

                            <option [ngValue]="0">
                                -- Select Category --
                            </option>

                            <option *ngFor="let c of categories" [ngValue]="c.id">

                                {{ c.name }}

                            </option>

                        </select>

                    </div>

                </div>

                <button type="submit" class="btn btn-success me-2">

                    {{ isEdit ? 'Update' : 'Save' }}

                </button>

                <button type="button" class="btn btn-secondary" (click)="resetForm()">

                    Reset

                </button>

            </form>

        </div>

    </div>

    <!-- Table -->

    <div class="card shadow mt-4">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">
                Skill List
            </h5>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover table-striped">

                <thead class="table-light">

                    <tr>

                        <th>ID</th>

                        <th>Skill Name</th>

                        <th>Category</th>

                        <th>Description</th>

                        <th width="180">
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="let s of skills">

                        <td>{{ s.skillId }}</td>

                        <td>{{ s.skillName }}</td>

                        <td>{{ s.categoryName }}</td>

                        <td>{{ s.categoryDescription }}</td>

                        <td>

                            <button class="btn btn-warning btn-sm me-2" (click)="editSkill(s)">

                                Edit

                            </button>

                            <button class="btn btn-danger btn-sm" (click)="deleteSkill(s.skillId)">

                                Delete

                            </button>

                        </td>

                    </tr>

                    <tr *ngIf="skills.length === 0">

                        <td colspan="5" class="text-center">

                            No Skills Found

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>
