<div class="container py-4">

    <!-- ============================= -->
    <!-- Filters -->
    <!-- ============================= -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <!-- Keyword -->

                <div class="col-lg-3">

                    <label class="form-label">

                        Keyword

                    </label>

                    <input type="text" class="form-control" [(ngModel)]="searchRequest.keyword"
                        placeholder="Search gigs">

                </div>

                <!-- Category -->

                <div class="col-lg-2">

                    <label class="form-label">

                        Category

                    </label>

                    <select class="form-select" [(ngModel)]="searchRequest.categoryId">

                        <option [ngValue]="0">

                            All Categories

                        </option>

                        <option *ngFor="let category of categories" [ngValue]="category.id">

                            {{category.name}}

                        </option>

                    </select>

                </div>

                <!-- Min Price -->

                <div class="col-lg-2">

                    <label class="form-label">

                        Min Price

                    </label>

                    <input type="number" class="form-control" [(ngModel)]="searchRequest.minPrice">

                </div>

                <!-- Max Price -->

                <div class="col-lg-2">

                    <label class="form-label">

                        Max Price

                    </label>

                    <input type="number" class="form-control" [(ngModel)]="searchRequest.maxPrice">

                </div>

                <!-- Delivery -->

                <div class="col-lg-3">

                    <label class="form-label">

                        Max Delivery Days

                    </label>

                    <input type="number" class="form-control" [(ngModel)]="searchRequest.maxDeliveryDays">

                </div>

                <!-- Rating -->

                <div class="col-lg-3">

                    <label class="form-label">

                        Minimum Rating

                    </label>

                    <input type="number" class="form-control" min="0" max="5" step="0.1"
                        [(ngModel)]="searchRequest.minimumRating">

                </div>

                <!-- Orders -->

                <div class="col-lg-3">

                    <label class="form-label">

                        Minimum Orders

                    </label>

                    <input type="number" class="form-control" [(ngModel)]="searchRequest.minimumOrders">

                </div>

                <!-- Buttons -->

                <div class="col-lg-6 d-flex align-items-end">

                    <button class="btn btn-primary me-2" (click)="searchGigs()">

                        <i class="bi bi-search me-1"></i>

                        Search

                    </button>

                    <button class="btn btn-outline-secondary" (click)="resetFilters()">

                        Reset

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ============================= -->
    <!-- Loading -->
    <!-- ============================= -->

    <div *ngIf="loading" class="text-center py-5">

        <div class="spinner-border text-primary">

        </div>

    </div>

    <!-- ============================= -->
    <!-- Empty -->
    <!-- ============================= -->

    <div *ngIf="!loading && gigs.length==0" class="alert alert-warning">

        No gigs found.

    </div>

    <!-- ============================= -->
    <!-- Gig Cards -->
    <!-- ============================= -->

    <div class="row" *ngIf="!loading && gigs.length">

        <div class="col-lg-4 col-md-6 mb-4" *ngFor="let gig of gigs">

            <div class="card shadow-sm h-100">

                <!-- Image -->

                <img [src]="fileService.getGigImage(gig.gigImage)" class="card-img-top"
                    style="height:220px;object-fit:cover;">

                <!-- Body -->

                <div class="card-body d-flex flex-column">

                    <span class="badge bg-primary align-self-start mb-2">

                        {{gig.categoryName}}

                    </span>

                    <h5 class="card-title">

                        {{gig.title}}

                    </h5>

                    <p class="text-muted small flex-grow-1">

                        {{gig.shortDescription}}

                    </p>

                    <hr>

                    <div class="mb-2">

                        <strong>

                            Seller

                        </strong>

                        <br>

                        {{gig.userName}}

                    </div>

                    <div class="d-flex justify-content-between small mb-2">

                        <span>

                            ⭐ {{gig.averageRating}}

                        </span>

                        <span>

                            {{gig.totalReviews}} Reviews

                        </span>

                    </div>

                    <div class="d-flex justify-content-between small mb-3">

                        <span>

                            {{gig.completedOrders}}
                            Orders

                        </span>

                        <span>

                            {{gig.deliveryDays}}
                            Days

                        </span>

                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-auto">

                        <h5 class="text-primary mb-0">

                            ৳ {{gig.startingPrice}}

                        </h5>

                        <button class="btn btn-primary btn-sm" (click)="viewGig(gig)">

                            View Gig

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
