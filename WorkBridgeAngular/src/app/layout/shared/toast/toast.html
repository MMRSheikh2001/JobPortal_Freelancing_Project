<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999">

    @for(t of toast.toasts; track t.id){

    <div class="toast show text-white mb-2" [class.bg-success]="t.type=='success'" [class.bg-danger]="t.type=='danger'"
        [class.bg-warning]="t.type=='warning'" [class.bg-info]="t.type=='info'">

        <div class="d-flex">

            <div class="toast-body">

                {{t.message}}

            </div>

            <button class="btn-close btn-close-white me-2 m-auto" (click)="toast.remove(t.id)">
            </button>

        </div>

    </div>

    }

</div>
