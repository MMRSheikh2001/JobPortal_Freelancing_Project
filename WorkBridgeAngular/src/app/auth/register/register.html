<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center bg-primary text-white">
                    <h3>Register</h3>
                </div>

                <div class="card-body">

                    <!-- Success Message -->
                    <div *ngIf="message" class="alert alert-success">
                        {{ message }}
                    </div>

                    <!-- Error Message -->
                    <div *ngIf="error" class="alert alert-danger">
                        {{ error }}
                    </div>

                    <form (ngSubmit)="register()">

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" [(ngModel)]="registerData.fullName" name="fullName"
                                required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" [(ngModel)]="registerData.email" name="email"
                                required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" [(ngModel)]="registerData.password"
                                name="password" required>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" [(ngModel)]="confirmPassword"
                                name="confirmPassword" required>
                        </div>

                        <!-- Role -->
                        <div class="mb-3">
                            <label class="form-label">Register As</label>

                            <select class="form-select" [(ngModel)]="registerData.role" name="role">

                                <option *ngFor="let role of roles" [value]="role">
                                    {{ role }}
                                </option>

                            </select>
                        </div>

                        <!-- Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Register
                            </button>
                        </div>

                    </form>

                </div>

                <div class="card-footer text-center">

                    Already have an account?

                    <a href="/login">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>
