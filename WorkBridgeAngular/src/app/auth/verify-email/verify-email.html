<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3 class="mb-4">
                        Email Verification
                    </h3>

                    <!-- Loading -->

                    <div *ngIf="loading">

                        <div class="spinner-border text-primary mb-3"></div>

                        <p>Verifying your email...</p>

                    </div>

                    <!-- Success -->

                    <div *ngIf="!loading && success">

                        <div class="text-success display-5 mb-3">
                            ✓
                        </div>

                        <h4 class="text-success">
                            Verification Successful
                        </h4>

                        <p class="mt-3">
                            {{ message }}
                        </p>

                        <button class="btn btn-primary mt-3" (click)="goToLogin()">
                            Go to Login
                        </button>

                    </div>

                    <!-- Failed -->

                    <div *ngIf="!loading && !success">

                        <div class="text-danger display-5 mb-3">
                            ✗
                        </div>

                        <h4 class="text-danger">
                            Verification Failed
                        </h4>

                        <p class="mt-3">
                            {{ message }}
                        </p>

                        <button class="btn btn-outline-primary mt-3" routerLink="/login">

                            Back to Login

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
