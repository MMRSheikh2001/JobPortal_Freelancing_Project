<div class="container py-5">

    <!-- Loading -->

    <div *ngIf="loading" class="text-center py-5">

        <div class="spinner-border text-success"></div>

    </div>

    <!-- Success -->

    <div *ngIf="!loading">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow-lg border-0">

                    <div class="card-body text-center p-5">

                        <!-- Success Icon -->

                        <div class="mb-4">

                            <i class="bi bi-check-circle-fill text-success display-1"></i>

                        </div>

                        <!-- Heading -->

                        <h2 class="fw-bold text-success mb-3">

                            Payment Successful!

                        </h2>

                        <!-- Message -->

                        <p class="text-muted fs-5 mb-4">

                            Your wallet has been credited successfully.

                        </p>

                        <p class="text-muted">

                            Thank you for your payment. Your transaction has been verified and your balance has already
                            been updated.

                        </p>

                        <hr class="my-4">

                        <!-- Buttons -->

                        <div class="d-grid gap-3">

                            <button class="btn btn-success btn-lg" (click)="goWallet()">

                                <i class="bi bi-wallet2 me-2"></i>

                                Go To Wallet

                            </button>

                            <button class="btn btn-outline-primary btn-lg" (click)="viewTransactions()">

                                <i class="bi bi-clock-history me-2"></i>

                                View Transaction History

                            </button>

                            <button class="btn btn-outline-secondary" (click)="goDashboard()">

                                <i class="bi bi-house-door me-2"></i>

                                Back To Dashboard

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
