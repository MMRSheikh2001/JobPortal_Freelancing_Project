<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">

                {{ isEdit ? 'Update Skill' : 'Add Skill' }}

            </h4>

        </div>

        <div class="card-body">

            <form #skillForm="ngForm" (ngSubmit)="save()">

                <div class="row">

                    <!-- Category -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Category

                        </label>

                        <select class="form-select" name="category" [(ngModel)]="selectedCategoryId"
                            (change)="categoryChanged()" required>

                            <option [ngValue]="0">

                                -- Select Category --

                            </option>

                            <option *ngFor="let c of categories" [ngValue]="c.id">

                                {{ c.name }}

                            </option>

                        </select>

                    </div>

                    <!-- Skill -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Skill

                        </label>

                        <select class="form-select" name="skill" [(ngModel)]="userSkill.skillId" required>

                            <option [ngValue]="0">

                                -- Select Skill --

                            </option>

                            <option *ngFor="let s of skills" [ngValue]="s.skillId">

                                {{ s.skillName }}

                            </option>

                        </select>

                    </div> <!-- Proficiency Level -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Proficiency Level

                        </label>

                        <select class="form-select" name="proficiencyLevel" [(ngModel)]="userSkill.proficiencyLevel"
                            required>

                            <option *ngFor="let level of proficiencyLevels" [ngValue]="level">

                                {{ level }}

                            </option>

                        </select>

                    </div>

                    <!-- Years of Experience -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Years of Experience

                        </label>

                        <input type="number" class="form-control" name="yearsOfExperience"
                            [(ngModel)]="userSkill.yearsOfExperience" min="0" required>

                    </div>

                </div>

                <hr>

                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary">

                        {{ isEdit ? 'Update Skill' : 'Save Skill' }}

                    </button>

                    <button type="button" class="btn btn-secondary" (click)="reset()">

                        Reset

                    </button>

                </div>

            </form>

        </div>

    </div><!-- User Skills List -->

    <div class="card shadow mt-4">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">

                Saved Skills

            </h5>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-light">

                        <tr>

                            <th>#</th>

                            <th>Category</th>

                            <th>Skill</th>

                            <th>Proficiency</th>

                            <th>Experience</th>

                            <th width="150">

                                Action

                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr *ngFor="let item of userSkills; let i = index">

                            <td>

                                {{ i + 1 }}

                            </td>

                            <td>

                                {{ item.categoryName }}

                            </td>

                            <td>

                                {{ item.skillName }}

                            </td>

                            <td>

                                <span class="badge bg-primary">

                                    {{ item.proficiencyLevel }}

                                </span>

                            </td>

                            <td>

                                {{ item.yearsOfExperience }}
                                Year{{ item.yearsOfExperience == 1 ? '' : 's' }}

                            </td>

                            <td>

                                <button class="btn btn-warning btn-sm me-2" (click)="edit(item)">

                                    Edit

                                </button>

                                <button class="btn btn-danger btn-sm" (click)="delete(item.id)">

                                    Delete

                                </button>

                            </td>

                        </tr>

                        <tr *ngIf="userSkills.length == 0">

                            <td colspan="6" class="text-center text-muted">

                                No skills added yet.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>
