<div class="container py-4">

    <!-- ===================================== -->
    <!-- Header -->
    <!-- ===================================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h3 class="fw-bold mb-0">
                Gig Orders
            </h3>

            <small class="text-muted">
                Buyers who ordered this gig
            </small>

        </div>

        <button class="btn btn-secondary" (click)="goBack()">

            <i class="bi bi-arrow-left me-2"></i>

            Back

        </button>

    </div>

    <!-- ===================================== -->
    <!-- Loading -->
    <!-- ===================================== -->

    <div *ngIf="loading" class="text-center py-5">

        <div class="spinner-border"></div>

    </div>

    <!-- ===================================== -->
    <!-- No Orders -->
    <!-- ===================================== -->

    <div *ngIf="!loading && orders.length==0" class="alert alert-info">

        No orders found for this gig.

    </div>

    <!-- ===================================== -->
    <!-- Orders Table -->
    <!-- ===================================== -->

    <div *ngIf="!loading && orders.length>0" class="table-responsive">

        <table class="table table-hover align-middle">

            <thead class="table-dark">

                <tr>

                    <th>Gig</th>

                    <th>Buyer</th>

                    <th>Quoted</th>

                    <th>Agreed</th>

                    <th>Status</th>

                    <th>Ordered</th>

                    <th width="120">
                        Action
                    </th>

                </tr>

            </thead>

            <tbody>

                <tr *ngFor="let order of orders">

                    <!-- Gig -->

                    <td>

                        <div class="d-flex align-items-center">

                            <img [src]="getGigImage(order.gigImage)" class="rounded me-3" width="70" height="70"
                                style="object-fit: cover;">

                            <div>

                                <div class="fw-semibold">

                                    {{order.gigTitle}}

                                </div>

                            </div>

                        </div>

                    </td>

                    <!-- Buyer -->

                    <td>

                        {{order.buyerName}}

                    </td>

                    <!-- Quoted -->

                    <td>

                        {{order.quotedPrice | number:'1.0-2'}}

                    </td>

                    <!-- Agreed -->

                    <td>

                        {{order.agreedPrice | number:'1.0-2'}}

                    </td>

                    <!-- Status -->

                    <td>

                        <span class="badge bg-primary">

                            {{order.status}}

                        </span>

                    </td>

                    <!-- Ordered -->

                    <td>

                        {{order.createdAt | date:'medium'}}

                    </td>

                    <!-- Action -->

                    <td>

                        <button class="btn btn-sm btn-outline-primary" (click)="viewOrder(order)">

                            View

                        </button>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
